<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rug History Explorer</title>
<style>
  :root {
    --paper: #efe7d4;
    --paper-2: #f8f2e2;
    --ink: #2b2a25;
    --muted: #6b6558;
    --line: #cfc2a0;
    --accent: #5a3a2a;
    --panel-w: 390px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--paper-2), var(--paper));
  }
  header h1 { margin: 0; font-size: 1.3rem; font-style: italic; font-weight: normal; white-space: nowrap; }
  .search { position: relative; margin-left: auto; flex: 0 1 300px; min-width: 180px; }
  .search input {
    width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 18px;
    background: #fffdf7; font: 14px "Trebuchet MS", Arial, sans-serif; color: var(--ink);
  }
  .results {
    position: absolute; top: 40px; left: 0; right: 0; background: #fffdf7; border: 1px solid var(--line);
    border-radius: 10px; max-height: 300px; overflow-y: auto; display: none; z-index: 20;
    box-shadow: 0 8px 20px rgba(60,50,30,.15);
  }
  .results.show { display: block; }
  .results div { padding: 8px 12px; cursor: pointer; font: 13px "Trebuchet MS", Arial, sans-serif; border-bottom: 1px solid #efe7d4; }
  .results div:hover { background: #f4ecd8; }
  .results small { color: var(--muted); display: block; }

  .main { flex: 1; display: flex; min-height: 0; }
  #mapwrap { flex: 1; position: relative; min-width: 0; overflow: hidden; background: #f4efe4; cursor: grab; touch-action: none; }
  #mapwrap.dragging { cursor: grabbing; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; }

  .hud { position: absolute; left: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
  .hud button {
    width: 38px; height: 38px; border-radius: 19px; border: 1px solid var(--line); background: #fffdf7;
    font: 20px "Trebuchet MS", Arial, sans-serif; color: var(--accent); cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.08);
  }
  .hud button:hover { background: #f4ecd8; }
  .count {
    position: absolute; top: 10px; left: 12px; z-index: 5; font: 12px "Trebuchet MS", Arial, sans-serif;
    color: var(--muted); background: rgba(255,253,247,.85); padding: 4px 9px; border-radius: 10px;
  }
  .legend {
    position: absolute; right: 12px; top: 10px; z-index: 5; width: 230px; max-height: calc(100% - 24px); overflow-y: auto;
    background: rgba(255,253,247,.94); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px; font: 12px "Trebuchet MS", Arial, sans-serif;
  }
  .legend h3 { margin: 0 0 6px; font: italic 13px Georgia, serif; color: var(--accent); display: flex; justify-content: space-between; align-items: center; gap: 8px; cursor: move; user-select: none; touch-action: none; }
  .legend h3 button { background: none; border: 1px solid var(--line); border-radius: 10px; width: 22px; height: 22px; padding: 0; cursor: pointer; color: var(--accent); font: 14px "Trebuchet MS", Arial, sans-serif; line-height: 1; flex: 0 0 22px; }
  .legend h3 button:hover { background: #f4ecd8; }
  .legend h3 button { display: flex; align-items: center; justify-content: center; padding: 0; line-height: 1; }
  .legend.min { width: auto; min-width: 150px; max-height: none; overflow: visible; }
  .legend.min h3 { margin-bottom: 0; }
  .legend button {
    display: flex; align-items: center; gap: 7px; width: 100%; background: none; border: none;
    padding: 3px 0; cursor: pointer; color: var(--ink); text-align: left; font: 12px "Trebuchet MS", Arial, sans-serif;
  }
  .legend button.off { opacity: .35; }
  .legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: 0 0 12px; border: 1px solid #fff; }
  .legend .key { margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; line-height: 1.4; }

  .panel {
    width: var(--panel-w); border-left: 1px solid var(--line); background: var(--paper-2);
    overflow-y: auto; padding: 18px 20px 28px; position: relative;
  }
  .panel .close {
    position: absolute; top: 10px; right: 12px; background: none; border: none; font-size: 22px;
    color: var(--muted); cursor: pointer;
  }
  .panel .tag {
    display: inline-block; font: 11px "Trebuchet MS", Arial, sans-serif; color: #fff; padding: 3px 9px; border-radius: 10px; margin-bottom: 8px;
    letter-spacing: .03em;
  }
  .panel h2 { margin: 0 0 2px; font-size: 1.5rem; font-weight: normal; font-style: italic; }
  .panel .meta { color: var(--muted); font: 13px "Trebuchet MS", Arial, sans-serif; margin-bottom: 14px; }
  .panel h4 {
    margin: 16px 0 4px; font: bold 11px "Trebuchet MS", Arial, sans-serif; text-transform: uppercase;
    letter-spacing: .08em; color: var(--accent);
  }
  .panel p, .panel li { font-size: 14px; line-height: 1.5; margin: 0 0 6px; }
  .panel ul { margin: 0; padding-left: 18px; }
  .photo {
    height: 110px; border: 1px dashed var(--line); border-radius: 10px; display: flex; align-items: center; justify-content: center;
    text-align: center; color: var(--muted); font: 13px "Trebuchet MS", Arial, sans-serif; padding: 10px; background: #f6f0de;
  }
  .panel a { color: var(--accent); }
  .linkrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .linkrow a {
    font: 12px "Trebuchet MS", Arial, sans-serif; border: 1px solid var(--line); border-radius: 12px;
    padding: 4px 10px; text-decoration: none; background: #fffdf7;
  }
  .rel a { display: inline-block; margin: 0 6px 6px 0; font-size: 13px; }
  .intro-box { background: #fffdf7; border-left: 3px solid var(--accent); padding: 10px 12px; border-radius: 6px; }
  .note-box { background: #f6f0de; border-left: 3px solid #b98a12; padding: 8px 10px; border-radius: 6px; font-size: 13px; }
  .empty-state h2 { font-size: 1.3rem; margin-top: 0; }
  .empty-state p { color: var(--muted); font-size: 14px; }
  .fam-list div { display: flex; gap: 8px; align-items: center; font: 13px "Trebuchet MS", Arial, sans-serif; padding: 3px 0; }
  .fam-list i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .note { font: 12px "Trebuchet MS", Arial, sans-serif; color: var(--muted); margin-top: 16px; }

  footer { font: 11px "Trebuchet MS", Arial, sans-serif; color: var(--muted); padding: 6px 14px; border-top: 1px solid var(--line); background: var(--paper-2); }

  @media (max-width: 760px) {
    body { overflow: auto; height: auto; }
    .main { flex-direction: column; }
    #mapwrap { height: 58vh; flex: none; }
    .panel { width: 100%; border-left: none; border-top: 1px solid var(--line); overflow: visible; }
    .legend { display: none; }
    header h1 { font-size: 1.1rem; }
    .search { flex: 1 1 100%; margin-left: 0; }
    html, body { height: auto; }
  }
</style>
</head>
<body>

<header>
  <h1>Rug History Explorer</h1>
  <div class="search">
    <input id="search" type="search" placeholder="Search rug, city, country, tradition, or alternate name…" autocomplete="off" aria-label="Search rug locations">
    <div class="results" id="results"></div>
  </div>
</header>

<div class="main">
  <div id="mapwrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" role="application" aria-label="Interactive map of rug-making regions"></svg>
    <div class="count" id="count"></div>
    <div class="legend" id="legend"><h3 id="legendHead">Traditions <button id="legMin" type="button" aria-label="Minimize legend" title="Minimize / expand"><svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><rect x="1" y="5" width="10" height="2" fill="currentColor"/></svg></button></h3><div id="legBody"></div></div>
    <div class="hud">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">−</button>
      <button id="zreset" aria-label="Reset to world view" title="World view">⟲</button>
    </div>
  </div>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>

<footer>Locations are approximate. Descriptions are drafted from the rug catalogue and need checking against museum and scholarly sources. Wikipedia and image links open in a new tab. Country borders and peaks: Natural Earth (public domain), simplified for display.</footer>

        var sx = S.tx + d.x * S.k, sy = S.ty + d.y * S.k;
        var fam = FAM[d.fam];
        var node = el("g", { style: "cursor:pointer" });
        if (S.sel === d.id) node.appendChild(el("circle", { cx: sx, cy: sy, r: 13, fill: "none", stroke: "#5a3a2a", "stroke-width": 2 }));
        node.appendChild(el("circle", { cx: sx, cy: sy, r: 7, fill: fam.c, stroke: "#ffffff", "stroke-width": 1.8 }));
        var title = el("title", {});
        title.textContent = d.name + " — " + d.cc;
        node.appendChild(title);
        node.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
        node.addEventListener("click", function (e) { e.stopPropagation(); select(d.id); });
        markerG.appendChild(node);
        if (z >= 4.8) {
          var lt = el("text", { x: sx + 11, y: sy + 4, "font-size": 12, "font-weight": "bold", fill: "#2b2a25", "font-family": "Georgia, serif", stroke: "#f4efe4", "stroke-width": 3, "paint-order": "stroke", "pointer-events": "none" });
          lt.textContent = d.name;
          markerG.appendChild(lt);
        }
      });
    }
  }

  // ---------- Selection and panel ----------
  var panel = document.getElementById("panel");

  function select(id) {
    var d = L_BY_ID[id];
    if (!d) return;
    S.sel = id;
    if (d.m) {
      if (zoomLevel() < 4.8) centerOn(d.x, d.y, S.kMin * 5.2);
      else centerOn(d.x, d.y, S.k);
    } else {
      render();
    }
    openPanel(d);
    document.getElementById("results").classList.remove("show");
    document.getElementById("search").value = d.name;
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]; });
  }
  function wikiUrl(term) { return "https://en.wikipedia.org/wiki/Special:Search?search=" + encodeURIComponent(term); }
  function commonsUrl(term) { return "https://commons.wikimedia.org/w/index.php?search=" + encodeURIComponent(term) + "&title=Special:MediaSearch&type=image"; }
  function metUrl(term) { return "https://www.metmuseum.org/art/collection/search?q=" + encodeURIComponent(term); }
  function vamUrl(term) { return "https://collections.vam.ac.uk/search/?q=" + encodeURIComponent(term); }

  function relatedFor(d) {
    return L.filter(function (o) { return o.id !== d.id && o.fam === d.fam && o.cc === d.cc; }).slice(0, 6);
  }

  function openPanel(d) {
    var fam = FAM[d.fam];
    var rel = relatedFor(d).map(function (o) {
      return '<a href="#" data-id="' + o.id + '">' + esc(o.name) + "</a>";
    }).join("");
    var alts = d.alt.length ? '<p>' + esc(d.alt.join(", ")) + "</p>" : "<p>None listed.</p>";
    var where = d.m ? "approx. " + d.lat.toFixed(2) + ", " + d.lon.toFixed(2) : "Not placed on the map";
    panel.innerHTML =
      '<button class="close" aria-label="Close panel" id="closePanel">×</button>' +
      '<span class="tag" style="background:' + fam.c + '">' + esc(fam.name) + "</span>" +
      "<h2>" + esc(d.name) + "</h2>" +
      '<div class="meta">' + esc(d.cc) + " · " + esc(KIND_LABEL[d.kind] || d.kind) + " · " + where + "</div>" +
      "<h4>Introduction</h4>" +
      '<div class="intro-box"><p>' + esc(d.intro) + "</p></div>" +
      (d.note ? '<h4>Note</h4><div class="note-box">' + esc(d.note) + "</div>" : "") +
      "<h4>Alternate names</h4>" + alts +
      "<h4>Related in this tradition</h4>" +
      '<div class="rel">' + (rel || "<p>None listed.</p>") + "</div>" +
      "<h4>Read further</h4>" +
      '<div class="linkrow">' +
        '<a href="' + wikiUrl(d.name) + '" target="_blank" rel="noopener">Wikipedia</a>' +
        '<a href="' + metUrl(d.name) + '" target="_blank" rel="noopener">The Met</a>' +
        '<a href="' + vamUrl(d.name) + '" target="_blank" rel="noopener">V&amp;A</a>' +
      "</div>";

    document.getElementById("closePanel").addEventListener("click", closePanel);
    panel.querySelectorAll(".rel a").forEach(function (a) {
      a.addEventListener("click", function (e) { e.preventDefault(); select(a.getAttribute("data-id")); });
    });
    panel.scrollTop = 0;
  }

  function closePanel() {
    S.sel = null;
    panel.innerHTML = emptyPanelHTML();
    render();
  }

  function emptyPanelHTML() {
    var rows = Object.keys(FAM).filter(function (k) { return k !== "root"; }).map(function (k) {
      return '<div><i style="background:' + FAM[k].c + '"></i>' + esc(FAM[k].name) + "</div>";
    }).join("");
    return '<div class="empty-state"><h2>Explore the rug world</h2>' +
      "<p>Zoom and pan the map to discover rug-making regions. Click a dot, a cluster, or a search result to open its history here. The map stays visible while you read.</p>" +
      '<div class="fam-list">' + rows + "</div>" +
      '<p class="note">Trade names, design classifications, and techniques are listed in search and marked in the panel. They are not places of origin.</p></div>';
  }

  // ---------- Legend ----------
  var legend = document.getElementById("legBody");
  Object.keys(FAM).forEach(function (k) {
    if (k === "root") return;
    var b = document.createElement("button");
    b.innerHTML = '<i style="background:' + FAM[k].c + '"></i>' + esc(FAM[k].name);
    b.addEventListener("click", function () {
      S.hidden[k] = !S.hidden[k];
      b.classList.toggle("off", !!S.hidden[k]);
      render();
    });
    legend.appendChild(b);
  });
  var key = document.createElement("div");
  key.className = "key";
  key.textContent = "Trade names, design classifications, and techniques are not places of origin. Triangles mark named peaks.";
  legend.appendChild(key);

  // ---------- Search ----------
  var input = document.getElementById("search");
  var results = document.getElementById("results");
  input.addEventListener("input", function () {
    var q = input.value.trim().toLowerCase();
    results.innerHTML = "";
    if (!q) { results.classList.remove("show"); return; }
    var hits = L.filter(function (d) {
      var hay = [d.name, d.cc, FAM[d.fam].name, KIND_LABEL[d.kind] || "", d.intro, d.note].concat(d.alt).join(" ").toLowerCase();
      return hay.indexOf(q) !== -1;
    }).slice(0, 12);
    if (!hits.length) {
      results.innerHTML = "<div>No matches</div>";
    } else {
      hits.forEach(function (d) {
        var row = document.createElement("div");
        row.innerHTML = esc(d.name) + "<small>" + esc(d.cc) + " · " + esc(FAM[d.fam].name) + (d.kind === "trade" || d.kind === "design" ? " · " + esc(KIND_LABEL[d.kind]) : "") + "</small>";
        row.addEventListener("click", function () { select(d.id); });
        results.appendChild(row);
      });
    }
    results.classList.add("show");
  });
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".search")) results.classList.remove("show");
  });

  // ---------- Controls ----------
  document.getElementById("zin").addEventListener("click", function () { zoomAt(S.W / 2, S.H / 2, S.k * 1.6); });
  document.getElementById("zout").addEventListener("click", function () { zoomAt(S.W / 2, S.H / 2, S.k / 1.6); });
  document.getElementById("zreset").addEventListener("click", function () {
    S.sel = null; S.k = S.kMin; clampView(); S.tx = (S.W - WORLD_W * S.k) / 2; S.ty = (S.H - WORLD_H * S.k) / 2; clampView();
    panel.innerHTML = emptyPanelHTML(); render();
  });

  wrap.addEventListener("wheel", function (e) {
    e.preventDefault();
    var r = wrap.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, S.k * Math.exp(-e.deltaY * 0.0015));
  }, { passive: false });

  wrap.addEventListener("dblclick", function (e) {
    var r = wrap.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, S.k * 2);
  });

  function pointerXY(e) { var r = wrap.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  var last = null;
  wrap.addEventListener("pointerdown", function (e) {
    if (e.target.closest(".hud, .legend")) return;
    S.pointers.set(e.pointerId, pointerXY(e));
    if (wrap.setPointerCapture) wrap.setPointerCapture(e.pointerId);
    if (S.pointers.size === 1) { last = pointerXY(e); wrap.classList.add("dragging"); }
    if (S.pointers.size === 2) {
      var p2 = Array.from(S.pointers.values());
      S.pinch = { d: Math.hypot(p2[0].x - p2[1].x, p2[0].y - p2[1].y), k: S.k };
    }
  });
  wrap.addEventListener("pointermove", function (e) {
    if (!S.pointers.has(e.pointerId)) return;
    S.pointers.set(e.pointerId, pointerXY(e));
    if (S.pointers.size === 1 && last) {
      var p = pointerXY(e);
      S.tx += p.x - last.x; S.ty += p.y - last.y;
      last = p;
      clampView(); render();
    } else if (S.pointers.size === 2 && S.pinch) {
      var p2 = Array.from(S.pointers.values());
      var d = Math.hypot(p2[0].x - p2[1].x, p2[0].y - p2[1].y);
      var mx = (p2[0].x + p2[1].x) / 2, my = (p2[0].y + p2[1].y) / 2;
      var wx = (mx - S.tx) / S.k, wy = (my - S.ty) / S.k;
      S.k = S.pinch.k * (d / S.pinch.d); clampView();
      S.tx = mx - wx * S.k; S.ty = my - wy * S.k; clampView();
      render();
    }
  });
  function endPointer(e) {
    S.pointers.delete(e.pointerId);
    if (S.pointers.size < 2) S.pinch = null;
    if (S.pointers.size === 0) { last = null; wrap.classList.remove("dragging"); }
    else if (S.pointers.size === 1) { last = Array.from(S.pointers.values())[0]; }
  }
  wrap.addEventListener("pointerup", endPointer);
  wrap.addEventListener("pointercancel", endPointer);
  wrap.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse") endPointer(e); });

  // ---------- Movable, minimizable legend ----------
  var legEl = document.getElementById("legend");
  var legHead = document.getElementById("legendHead");
  var legMin = document.getElementById("legMin");
  var legBody = document.getElementById("legBody");
  var legDrag = null;

  // Keep map gestures (pan, wheel zoom) from firing while using the legend
  legEl.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
  legEl.addEventListener("wheel", function (e) { e.stopPropagation(); }, { passive: true });

  legHead.addEventListener("pointerdown", function (e) {
    if (e.target === legMin) return;
    var r = legEl.getBoundingClientRect();
    legDrag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
    if (legHead.setPointerCapture) legHead.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  document.addEventListener("pointermove", function (e) {
    if (!legDrag) return;
    var pr = wrap.getBoundingClientRect();
    var maxX = Math.max(0, pr.width - legEl.offsetWidth);
    var maxY = Math.max(0, pr.height - legEl.offsetHeight);
    var x = Math.max(0, Math.min(maxX, e.clientX - pr.left - legDrag.dx));
    var y = Math.max(0, Math.min(maxY, e.clientY - pr.top - legDrag.dy));
    legEl.style.left = x + "px";
    legEl.style.top = y + "px";
    legEl.style.right = "auto";
  });

  function endLegDrag() { legDrag = null; }
  document.addEventListener("pointerup", endLegDrag);
  document.addEventListener("pointercancel", endLegDrag);

  legMin.addEventListener("click", function (e) {
    e.stopPropagation();
    var minimized = legEl.classList.toggle("min");
    legBody.style.display = minimized ? "none" : "";
    legMin.innerHTML = minimized ? "<svg viewBox=\"0 0 12 12\" width=\"10\" height=\"10\" aria-hidden=\"true\"><rect x=\"1\" y=\"5\" width=\"10\" height=\"2\" fill=\"currentColor\"/><rect x=\"5\" y=\"1\" width=\"2\" height=\"10\" fill=\"currentColor\"/></svg>" : "<svg viewBox=\"0 0 12 12\" width=\"10\" height=\"10\" aria-hidden=\"true\"><rect x=\"1\" y=\"5\" width=\"10\" height=\"2\" fill=\"currentColor\"/></svg>";
    legMin.setAttribute("aria-label", minimized ? "Expand legend" : "Minimize legend");
  });

  // ---------- Init ----------
  panel.innerHTML = emptyPanelHTML();
  var ro = new ResizeObserver(function () { setup(); });
  ro.observe(wrap);
  window.addEventListener("resize", setup);
  setup();
})();
</script>
</body>
</html>
